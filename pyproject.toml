[project]
name = "studynote"
version = "1.0.0"
description = "操作系统概论、计算机组成原理、计算机网络技术和多媒体技术的章节笔记与交互练习"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==11.0.1",
]

[tool.uv]
# 依赖以本文件为唯一来源；锁定文件为 uv.lock。
# 常规构建与检查用 `uv run --locked`，只在升级依赖时显式 `uv lock`。
# 代理是可选项，按需通过 tools/dev/uv.ps1 -Proxy 注入，默认尊重环境变量。
